name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Both operating systems on purpose: this is a path-handling tool, and a
    # Linux-only matrix already let a Windows/POSIX path bug through once.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The ASR extra pulls in CTranslate2 and is not needed for the tests:
      # everything except the transcription stage runs without it.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Generate the synthetic demo corpus
        run: python examples/make_demo_data.py

      - name: Test
        run: pytest -q
